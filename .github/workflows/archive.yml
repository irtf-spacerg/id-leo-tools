name: "Archive Issues and Pull Requests"

on:
  schedule:
    - cron: '0 0 * * 0,2,4'
  repository_dispatch:
    types: [archive]
  workflow_dispatch:
    inputs:
      archive_full:
        description: 'Recreate the archive from scratch'
        default: false
        type: boolean

# Every workflow that writes the gh-pages branch shares this group, so GitHub
# never runs two of them at once. Without it, i-d-template's `make gh-pages`
# and `make gh-archive` clone the branch and later `git push -f` it, which
# silently rewinds any registry deploy that landed in between.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: "Archive Issues and Pull Requests"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
    - name: "Checkout"
      uses: actions/checkout@v6

    # Note: No caching for this build!

    - name: "Update Archive"
      uses: martinthomson/i-d-template@v1
      env:
        ARCHIVE_FULL: ${{ inputs.archive_full }}
      with:
        make: archive
        token: ${{ github.token }}

    - name: "Update GitHub Pages"
      uses: martinthomson/i-d-template@v1
      with:
        make: gh-archive
        token: ${{ github.token }}

    - name: "Save Archive"
      uses: actions/upload-artifact@v6
      with:
        name: archive
        path: archive.json
